name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install -U pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify installed article entry points outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m Articles.cluster_runner --help
          python -m Articles.collect_data --dry-run --output "$RUNNER_TEMP/entrypoint-check"

      - name: Check CHE setup with a Python that has no pip
        if: matrix.python-version == '3.11'
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/python-no-pip"
          bash Articles/cluster/setup_environment.sh "$RUNNER_TEMP/python-no-pip/bin/python" "$RUNNER_TEMP/che-venv"
          bash -n Articles/cluster/smoke.slurm
          bash -n Articles/cluster/production.slurm
          bash -n Articles/cluster/job_environment.sh

      - name: Lint article code
        run: |
          python -m ruff check Articles tests/test_article_core.py tests/test_article_scan.py tests/test_article_cluster.py

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
        continue-on-error: true

      - name: Tests
        run: python -m pytest -q

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -U pip

      - name: Install dev extras (if available)
        run: python -m pip install -e ".[dev]"
        continue-on-error: true

      - name: Fallback base install
        if: failure()
        run: python -m pip install -e .

      - name: Run examples (if present)
        run: |
          chmod +x scripts/run_examples.sh || true
          DRY_RUN=0 scripts/run_examples.sh || echo "No examples yet"
